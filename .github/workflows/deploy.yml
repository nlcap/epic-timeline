name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a redeploy manually from the Actions tab without
  # needing a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time -- a second push while one is still
# running waits for it rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default single-commit shallow clone -- the
      # build reads each seed data file's last-commit date via `git log
      # --follow` (see the collectionUpdatedAt plugin in vite.config.ts) to
      # show "Last updated" in the Reset line data modal, which needs the
      # real history to search.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Gate the deploy on both -- a step that fails stops the job before
      # the build/deploy steps below ever run, so a broken type/lint check
      # or a failing test blocks that push from going live instead of
      # silently deploying over it.
      - run: npm run lint
      - run: npm run test
      - run: npm run build
        env:
          GITHUB_PAGES: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
